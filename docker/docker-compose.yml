services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: tacacs_docker_socket_proxy
    environment:
      - LOG_LEVEL=warning
      - CONTAINERS=1
      - EXEC=1
      - POST=1
      - PING=1
      - VERSION=1
      - EVENTS=0
      - AUTH=0
      - SECRETS=0
      - SERVICES=0
      - TASKS=0
      - IMAGES=0
      - NETWORKS=0
      - NODES=0
      - SWARM=0
      - SYSTEM=0
      - VOLUMES=0
      - DISTRIBUTION=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - PLUGINS=0
      - SESSION=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - tac_network

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: tacacs_proxy
    environment:
      - TZ=Europe/Moscow
    ports:
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs/tls.pem:/etc/nginx/certs/tls.pem:ro
    restart: unless-stopped
    depends_on:
      - tacacs-frontend
      - tacacs-api
    networks:
      - tac_network

  tacacs-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: tacacs_frontend
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    depends_on:
      - tacacs-api
    networks:
      - tac_network

  # FASTAPI TACACS Management API (новый API)
  tacacs-api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    environment:
      - DATABASE_URL=postgresql://admin_pg:supersecret@database:5432/tacacs_db
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Moscow
      - RELOADER_SOCKET_PATH=/run/tacacs-reloader/reloader.sock
      - RELOADER_APPLY_TIMEOUT=30
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tac_network
    volumes:
      - tacacs_generated_data:/etc/tac_plus-ng
      - ./tac_plus_ng/logs/tac_plus-ng.log:/var/log/tac_plus-ng/tac_plus-ng.log:ro
      - tacacs_reloader_socket:/run/tacacs-reloader
    depends_on:
      - postgres
      - tacacs-reloader

  # PostgreSQL база данных
  postgres:
    image: postgres:14
    container_name: database
    environment:
      POSTGRES_USER: admin_pg
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: tacacs_db
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - tacacs_pg14_data:/var/lib/postgresql/data
      - ./database/init-sql:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - tac_network

  # TACACS+ сервис
  tac_plus-ng:
    build: 
      context: ./tac_plus_ng
      dockerfile: Dockerfile
    container_name: tacacs_plus
    hostname: tacacs_plus
    environment:
      - TZ=Europe/Moscow
    ports:
      - "49:49"
    volumes:
      - ./tac_plus_ng/config/tac_plus-ng.cfg:/etc/tac_plus-ng/tac_plus-ng.cfg:ro
      - tacacs_generated_data:/etc/tac_plus-ng
      - ./tac_plus_ng/logs/tac_plus-ng.log:/var/log/tac_plus-ng/tac_plus-ng.log
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f tac_plus-ng >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - tac_network
    restart: unless-stopped

  tacacs-reloader:
    build:
      context: ./reloader
      dockerfile: Dockerfile
    container_name: tacacs_reloader
    environment:
      - WATCH_DIR=/etc/tac_plus-ng
      - POLL_INTERVAL=2
      - RELOADER_FILES=users,user_groups,devices,profiles,ruleset
      - TARGET_CONTAINER=tacacs_plus
      - RESTART_TIMEOUT=3
      - VALIDATION_CMD=tac_plus-ng -P /etc/tac_plus-ng/tac_plus-ng.cfg
      - RELOADER_SOCKET_PATH=/run/tacacs-reloader/reloader.sock
      - DOCKER_PROXY_URL=http://docker-socket-proxy:2375
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Moscow
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - tacacs_generated_data:/etc/tac_plus-ng:ro
      - tacacs_reloader_socket:/run/tacacs-reloader
    restart: unless-stopped
    networks:
      - tac_network
    depends_on:
      - tac_plus-ng
      - docker-socket-proxy

networks:
  tac_network:
    driver: bridge

volumes:
  tacacs_pg14_data:
  tacacs_generated_data:
  tacacs_reloader_socket:
